[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "holodex-tui"
version = "1.0.0"
description = "A minimal TUI for browsing Holodex livestreams"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "rich>=13.0.0",
]

[project.scripts]
holodex-tui = "holodex_tui.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["holodex_tui*"]
